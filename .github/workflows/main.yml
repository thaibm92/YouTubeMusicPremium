name: Build and Release YTMusicUltimate

on:
  workflow_dispatch:
    inputs: 
      decrypted_youtube_music_url:
        description: "The direct URL to the decrypted YouTube Music ipa (Upload a decrypted .ipa file to Dropbox and input its URL here.)"
        default: "https://iosmod.net/IPAs/YouTube_Music_7.31.2.ipa"
        required: true
        type: string    
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.1.1
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make coreutils

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

      - name: Setup Theos
        uses: actions/checkout@v4.1.7
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4.0.1
        env:
          cache-name: iOS-16.5-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare YouTube Music iPA
        run: wget "$YOUTUBE_MUSIC_URL" --no-verbose -O main/YouTubeMusic.ipa

        env:
          YOUTUBE_MUSIC_URL: ${{ inputs.decrypted_youtube_music_url }}    

      - name: Build Tweak for Sideloading
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          make clean package SIDELOADING=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install Cyan
        run: |
          brew install pipx
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweak into provided IPA
        run: |
          cd ${{ github.workspace }}/main/packages
          tweakName=$(ls)
          cd ${{ github.workspace }}/main
          cyan -i YouTubeMusic.ipa -o packages/YouTubeMusic.ipa -uwsf packages/$tweakName

      - name: Prepare YouTube Music iPA
        id: prepare_youtube_music
        run: |
          cd ${{ github.workspace }}/main/packages
          mv YouTubeMusic.ipa YouTubeMusic.zip
          unzip YouTubeMusic.zip
          youtubemusic_version=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "Payload/YouTubeMusic.app/Info.plist")
          echo "==> YouTube Music v$youtubemusic_version Unziped!"
          echo "youtubemusic_version=${youtubemusic_version}" >> $GITHUB_OUTPUT
          cd Payload/YoutubeMusic.app
          rm -rf Watch
          echo "==> Removed Watch folder"
          cd ../..
          zip -r YouTube_Music_Premium_$youtubemusic_version.ipa Payload > /dev/null
          echo "==> YouTube_Music_Premium_$youtubemusic_version.ipa Ziped!"
          rm -rf Payload
          ls
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: YouTubeMusicPremium_${{ steps.prepare_youtube_music.outputs.youtubemusic_version }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error
          
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ inputs.create_release }}
        with:
          tag_name: v${{ steps.prepare_youtube_music.outputs.youtubemusic_version }}
          name: v${{ steps.prepare_youtube_music.outputs.youtubemusic_version }}
          files: |
            main/packages/*.deb
            main/packages/*.ipa
          draft: ${{ env.DRAFT }}
